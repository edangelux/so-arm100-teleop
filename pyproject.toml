# Herramientas de calidad del código Python de la aplicación (app/).
# ruff check app pruebas/py      pytest pruebas/py
[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["entrega", "overlay", "cad", "analisis", "brazo-fisico"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM"]
ignore = ["E501", "SIM108", "SIM105", "B008", "B905"]

[tool.pytest.ini_options]
testpaths = ["pruebas/py"]
