# MoveIt comanda directamente los controladores del brazo físico (modo real),
# que viven en el espacio de nombres /real.
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager
moveit_simple_controller_manager:
  controller_names:
    - real/arm_controller
    - real/gripper_controller
  real/arm_controller:
    type: FollowJointTrajectory
    joints: [Shoulder_Rotation, Shoulder_Pitch, Elbow, Wrist_Pitch, Wrist_Roll]
    action_ns: follow_joint_trajectory
    default: true
  real/gripper_controller:
    type: GripperCommand
    joints: [Gripper]
    action_ns: gripper_cmd
    default: true
